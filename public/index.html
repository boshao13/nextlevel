<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0e11" />

    <!-- Per-page <title>, description, canonical, and og/twitter title+description
         are set by react-helmet on every route and baked in at prerender, so each
         page is the single source of truth (no duplicate/ambiguous tags). index.html
         keeps only the fields that are identical site-wide: the social card image,
         keywords, author, and the static og/twitter scaffolding. -->
    <meta
      name="keywords"
      content="epoxy flooring Albuquerque, epoxy flooring Santa Fe, epoxy flooring Rio Rancho, garage floor coating Albuquerque, concrete coatings New Mexico, polyaspartic flooring NM, commercial epoxy Albuquerque, residential epoxy Santa Fe"
    />
    <meta name="author" content="Next Level Epoxy Flooring" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / Twitter — shared brand link-preview card + static fields only.
         og:title / og:description / og:url come from react-helmet per page. -->
    <meta property="og:image" content="https://www.nextlevelepoxynm.com/images/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Next Level Epoxy Flooring — lifetime-warranty epoxy floors in Albuquerque, Santa Fe & Rio Rancho, NM" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Next Level Epoxy Flooring" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.nextlevelepoxynm.com/images/twitter-image.jpg" />

    <!-- SEO-optimized title: "Epoxy Flooring Albuquerque" in first 30 chars -->
    <title>Epoxy Flooring Albuquerque, Santa Fe & Rio Rancho NM | Next Level Epoxy</title>

    <!-- Custom Fonts (preconnect + preload the H1/body weights so the font
         race isn't lost to the hero video; if Google bumps the font version
         these preloads become harmless no-ops and the stylesheet still wins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLDD4Z1xlFd2JQEk.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/poppins/v24/pxiEyp8kv8JHgFVrJJfecnFHGPc.woff2" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />


    <!-- Google Analytics (GA4) + Google Ads (AW). Loaded ONLY on public
         marketing routes. Skipped on /sign|/signed (the secret e-sign token in
         the URL would leak to Google via page_location) and /admin (keep
         third-party JS off the origin that holds the admin JWT). gtag() stays
         defined everywhere so no code throws. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      (function () {
        var p = window.location.pathname;
        if (p.indexOf('/sign') === 0 || p.indexOf('/admin') === 0) return;
        gtag('config', 'G-NZ6KRRHCG0');
        gtag('config', 'AW-11478525428');
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-NZ6KRRHCG0';
        document.head.appendChild(s);
      })();
    </script>

    <style>
      body {
        font-family: 'Poppins', sans-serif;

        margin: 0;
